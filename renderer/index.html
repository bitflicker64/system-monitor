<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System Monitor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>System Monitor</h1>
      <p id="sys-info">Loading…</p>
    </header>

    <section class="card">
      <div class="card-head">
        <span>CPU</span>
        <strong id="cpu-value">–</strong>
      </div>
      <div class="bar"><div id="cpu-bar" class="fill"></div></div>
      <canvas id="cpu-chart" width="460" height="80"></canvas>
    </section>

    <section class="card">
      <div class="card-head">
        <span>Memory</span>
        <strong id="ram-value">–</strong>
      </div>
      <div class="bar"><div id="ram-bar" class="fill"></div></div>
      <p id="ram-detail" class="muted"></p>
    </section>
  </body>
</html>
