<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System Monitor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>System Monitor</h1>
      <p id="sys-info">Loading…</p>
    </header>

    <section class="card">
      <div class="card-head">
        <span>CPU</span>
        <strong id="cpu-value">–</strong>
      </div>
      <div class="bar"><div id="cpu-bar" class="fill"></div></div>
      <canvas id="cpu-chart" width="460" height="80"></canvas>
    </section>

    <section class="card">
      <div class="card-head">
        <span>Memory</span>
        <strong id="ram-value">–</strong>
      </div>
      <div class="bar"><div id="ram-bar" class="fill"></div></div>
      <p id="ram-detail" class="muted"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <span>Battery</span>
        <strong id="battery-value">–</strong>
      </div>
      <p id="power-source" class="muted"></p>
    </section>

    <section class="card">
      <div class="card-head"><span>Alert when RAM above</span></div>
      <div class="row">
        <input id="threshold" type="range" min="10" max="100" step="5" value="90" />
        <strong id="threshold-value">90%</strong>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><span>Power events</span></div>
      <ul id="events" class="muted"><li>Waiting for events…</li></ul>
    </section>

    <script src="renderer.js"></script>
  </body>
</html>
